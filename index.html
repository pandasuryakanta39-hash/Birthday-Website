<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Minakshi ❤️</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#ff7eb3,#ff758c,#ffb199);
min-height:100vh;color:white;overflow-x:hidden;text-align:center;
}
.curtain{
position:fixed;top:0;width:50%;height:100%;background:#7a003c;
z-index:100;transition:2s;
}
.left{left:0}.right{right:0}
.open .left{transform:translateX(-100%)}
.open .right{transform:translateX(100%)}
.container{padding:40px 20px}
h1{font-size:3rem;margin-top:40px}
.gift{
width:140px;height:140px;margin:30px auto;background:#ff3d6e;
border-radius:15px;display:flex;align-items:center;justify-content:center;
font-size:60px;cursor:pointer;box-shadow:0 0 25px white;
}
.message{
max-width:800px;margin:20px auto;font-size:1.2rem;line-height:1.8;
min-height:180px;
}
.slider{max-width:900px;margin:30px auto}
.slider img{
width:100%;border-radius:20px;
box-shadow:0 0 20px rgba(255,255,255,.5)
}
.note{margin-top:15px}
footer{padding:30px}
.heart{
position:fixed;bottom:-20px;animation:float 8s linear infinite;
}
@keyframes float{
from{transform:translateY(0)}
to{transform:translateY(-110vh)}
}
button{
padding:12px 25px;border:none;border-radius:30px;
cursor:pointer;font-size:16px
}
</style>
</head>
<body>

<div class="curtain left"></div>
<div class="curtain right"></div>

<div class="container">
<h1>💖 Dear Minakshi 💖</h1>
<p>A Special Surprise From Your Brother</p>

<div class="gift" onclick="openGift()">🎁</div>

<div class="message" id="msg"></div>

<div class="slider">
<img id="slide" src="const photos=[
"https://raw.githubusercontent.com/pandasuryakanta39-hash/Birthday-Website/9f5531c1d65e9d3f4f37049be1a53df84eb50829/FB_IMG_1596181331625.jpg",
"https://raw.githubusercontent.com/pandasuryakanta39-hash/Birthday-Website/9f5531c1d65e9d3f4f37049be1a53df84eb50829/IMG-20200610-WA0007.jpg",
"https://raw.githubusercontent.com/pandasuryakanta39-hash/Birthday-Website/9f5531c1d65e9d3f4f37049be1a53df84eb50829/IMG-20260411-WA0017.jpg",
"https://raw.githubusercontent.com/pandasuryakanta39-hash/Birthday-Website/9f5531c1d65e9d3f4f37049be1a53df84eb50829/IMG20240421101626.jpg",
"https://raw.githubusercontent.com/pandasuryakanta39-hash/Birthday-Website/9f5531c1d65e9d3f4f37049be1a53df84eb50829/IMG20241123123616.jpg",
"https://raw.githubusercontent.com/pandasuryakanta39-hash/Birthday-Website/9f5531c1d65e9d3f4f37049be1a53df84eb50829/FB_IMG_1596181331625.jpg"
]" alt="Memory Photo">
<p class="note">Replace photo1.jpg to photo6.jpg with your own photos.</p>
</div>

<audio id="music" controls>
<source src="music.mp3" type="audio/mpeg">
</audio>

<footer>
Made With ❤️ By SuryaKant
</footer>
</div>

<script>
const text=`Dear Minakshi,

You are one of the most precious gifts in my life.

Thank you for every smile, every memory, every moment of support and care.

No matter how much time passes, you will always be my wonderful sister and one of the most important people in my heart.

May your life be filled with happiness, success, love and beautiful memories.

Love You Forever ❤️

— Your Brother,
SuryaKant`;

function openGift(){
document.body.classList.add("open");
let i=0;
const el=document.getElementById("msg");
const timer=setInterval(()=>{
el.innerHTML+=text.charAt(i).replace(/\n/g,"<br>");
i++;
if(i>=text.length) clearInterval(timer);
},35);
}

const photos=["photo1.jpg","photo2.jpg","photo3.jpg","photo4.jpg","photo5.jpg","photo6.jpg"];
let idx=0;
setInterval(()=>{
idx=(idx+1)%photos.length;
document.getElementById("slide").src=photos[idx];
},3000);

for(let i=0;i<25;i++){
let h=document.createElement("div");
h.className="heart";
h.innerHTML="💖";
h.style.left=Math.random()*100+"vw";
h.style.fontSize=(20+Math.random()*25)+"px";
h.style.animationDuration=(5+Math.random()*6)+"s";
document.body.appendChild(h);
}
</script>

</body>
</html>
